<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hasil Pencarian Hotel - Traveloka Clone</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand fw-bold" href="#">Traveloka</a>
    <div class="d-flex">
      <button class="btn btn-outline-light btn-sm">Login</button>
    </div>
  </div>
</nav>

<div class="bg-white border-bottom shadow-sm mb-4">
  <div class="container py-3">
    <div class="d-flex flex-wrap align-items-center justify-content-between">
      <div>
        <h6 class="mb-0 fw-bold">Jakarta, Indonesia</h6>
        <small class="text-muted">25 Apr 2026 - 26 Apr 2026 · 1 Kamar · 2 Tamu</small>
      </div>
      <button class="btn btn-sm btn-outline-primary mt-2 mt-md-0">Ubah Pencarian</button>
    </div>
  </div>
</div>

<div class="container my-4">
  <div class="row">
    
    <div class="col-md-3">
      <div class="card p-3 shadow-sm border-0 mb-4">
        <h5>Filter</h5>
        <hr>
        <h6>Harga per malam</h6>
        <input type="range" class="form-range">
        <h6 class="mt-3">Bintang</h6>
        <div class="form-check"><input class="form-check-input" type="checkbox"> <label>5 Bintang</label></div>
        <div class="form-check"><input class="form-check-input" type="checkbox"> <label>4 Bintang</label></div>
      </div>
    </div>

    <div class="col-md-9">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0">Ditemukan 1 Hotel</h5>
        <select class="form-select w-auto">
          <option>Harga Terendah</option>
          <option>Rating Tertinggi</option>
          <option>Paling Populer</option>
        </select>
      </div>
      
      <div class="card shadow-sm border-0 mb-3 overflow-hidden">
        <div class="row g-0">
          <div class="col-md-4"><img src="https://images.unsplash.com/photo-1618773928121-c32242e63f39?q=80&w=2070&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" class="img-fluid h-100 object-fit-cover"></div>
          <div class="col-md-8">
            <div class="card-body">
              <div class="d-flex justify-content-between">
                <h5 class="card-title fw-bold">Grand Hotel Mewah Jakarta</h5>
                <span class="badge bg-primary">8.5 / 10</span>
              </div>
              <p class="text-muted small"><i class="bi bi-geo-alt"></i> Jakarta Pusat</p>
              <div class="d-flex justify-content-between align-items-center mt-3">
                <h5 class="text-danger fw-bold">Rp 1.500.000</h5>
                <a href="detail-hotel.html" class="btn btn-outline-primary">Lihat Detail</a>
              </div>
            </div>
          </div>
        </div>
      </div>
      </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
